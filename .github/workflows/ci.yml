name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: action_inbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/action_inbox_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/action_inbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-ci-1234
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-ci-1234
          CREDENTIAL_ENCRYPTION_KEY_V1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
